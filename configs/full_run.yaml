# Real experiment config -- same schema as configs/local_debug.yaml, heavier settings.
# Still CPU-only; run this after local_debug.yaml has been validated end-to-end.

experiment_name: full_run

seeds: [0, 1, 2]
device: cpu

data:
  image_size: 28
  num_workers: 0
  batch_size: 32
  # Cross-specialty non-IID: one specialty subset = one simulated hospital.
  specialties:
    - PathMNIST
    - DermaMNIST
    - BloodMNIST
    - OCTMNIST
    - TissueMNIST
  data_root: ./data_cache
  # No/relaxed cap for the real run.
  subsample_cap: null
  val_fraction: 0.1

model:
  backbone: resnet18
  pretrained: true
  freeze_backbone: true
  lora:
    r: 8   # ablation winner (Table T4): rank=8 gave the best accuracy/communication tradeoff
    alpha: 8
    dropout: 0.05
    target_modules: [conv1, layer1, layer2, layer3, layer4]

federated:
  num_clients: 5
  rounds: 30   # reduced from 50 for a laptop-defensible publication budget -- see experiments/estimate.py
  local_epochs: 2
  client_fraction: 1.0   # fraction C of clients sampled by the server each round
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001

method:
  name: fedsaa   # one of: fedsaa | fedavg | fedprox | local_only | centralized
  fedsaa:
    # ablation winner (Table T4 / Step 14 sweep): lambda=0.5, tau=0.5, rank=8, client_fraction=1.0
    tau: 0.5
    lambda: 0.5
    svd_rank: 8
    # local adapter retention: final_i = (1 - alpha) * global_personalized_i + alpha * local_i
    # (blends the server's aggregated result back toward each client's own pre-aggregation
    # adapter, rather than fully overwriting it -- NOT yet validated by any run, see Step 15)
    alpha: 0.3
    # brief post-aggregation local fine-tune (SGD mini-batches, not full epochs) each
    # participating client runs on its own data after retention-blending, before evaluation
    post_agg_adapt_steps: 5
  fedprox:
    mu: 0.01

logging:
  results_dir: ./results
  log_every_round: 1
  save_checkpoints: false

reproducibility:
  deterministic: true
  cudnn_benchmark: false
